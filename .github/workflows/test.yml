name: PyTest

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pixi-environment: ["py311", "py312"]

    steps:
      - uses: actions/checkout@v7

      - uses: extractions/netrc@v3
        with:
          machine: urs.earthdata.nasa.gov
          username: ${{ secrets.EARTHDATA_USERNAME }}
          password: ${{ secrets.EARTHDATA_PASSWORD }}

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: latest
          environments: ${{ matrix.pixi-environment }}

      - name: Pytest in pixi environment
        env:
          PIXI_ENVIRONMENT: ${{ matrix.pixi-environment }}
        run: |
          pixi run -e "$PIXI_ENVIRONMENT" python -m pip install --no-deps .
          pixi run -e "$PIXI_ENVIRONMENT" pytest .
