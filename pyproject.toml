[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm[toml]>=3.4"]

[tool.ruff]
exclude = ["isce2_topsapp/packaging_utils", 
           "tests/prepare-for-delivery.ipynb", 
           "tests/prepare-for-delivery.ipynb",
           "tests/solid_earth_tides.ipynb"]

[tool.pixi.workspace]
name = "DockerizedTopsApp"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64"]

[tool.pixi.tasks]
install = "python -m pip install --no-deps -e ."
lint = "ruff check isce2_topsapp tests"
format = "ruff format isce2_topsapp tests"
fix = "ruff check --fix isce2_topsapp tests"
test = { cmd = "pytest .", depends-on = ["install"] }
lab = "jupyter lab"

[tool.pixi.dependencies]
python = ">=3.11,<3.13"
affine = ">=2.4.0,<3"
asf_search = ">=12.2.3,<13"
boto3 = ">=1.43.64,<2"
dask = ">=2026.7.1,<2027"
dateparser = ">=1.4.2,<2"
fsspec = ">=2026.7.0,<2027"
gdal = ">=3.10.3,<4"
geopandas = ">=1.1.4,<2"
ipykernel = ">=7.3.0,<8"
isce2 = "==2.6.4"
jinja2 = ">=3.1.6,<4"
joblib = ">=1.5.3,<2"
jsonschema = ">=4,<5"
lxml = ">=6.1.1,<7"
matplotlib = ">=3.11.1,<4"
netcdf4 = ">=1.7.4,<2"
numpy = ">=1.24,<3"
pandas = ">=2.2,<4"
pandera = ">=0.32.1,<0.33"
pysolid = ">=0.3.4,<0.4"
papermill = ">=2.7.0,<3"
pytest = ">=9.1.1,<10"
pydantic = ">=2.13.4,<3"
pytest-cov = ">=7.1.0,<8"
pytest-mock = ">=3.15.1,<4"
rasterio = ">=1.4.4,<2"
requests = ">=2.34.2,<3"
rioxarray = ">=0.19.0,<0.20"
ruff = ">=0.16.1,<0.17"
xarray = ">=2026.7.0,<2027"
scipy = ">=1.11,<2"
setuptools = ">=83.0.0,<84"
setuptools_scm = ">=10.2.1,<11"
shapely = ">=2.1.2,<3"
tqdm = ">=4.70.0,<5"
dem_stitcher = ">=2.5.13,<3"
aiohttp = ">=3.14.3,<4"
tile_mate = ">=0.0.15"
s1_orbits = ">=0.2.0,<0.3"
jupyterlab = ">=4.6.2,<5"
jupyter-collaboration = ">=5.0.0,<6"
pip = ">=25"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["py311"], solve-group = "py311" }
py311 = { features = ["py311"], solve-group = "py311" }
py312 = { features = ["py312"], solve-group = "py312" }
